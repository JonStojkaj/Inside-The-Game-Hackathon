[project]
name = "sliding-doors-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pydantic>=2.7",
    "openai>=1.106",
    "azure-identity>=1.17",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
# Microsoft Agent Framework (agents + workflow, AGENT_RUNTIME=framework). Not needed by the API container,
# which only serves pre-computed exports; without it the agents fall back to AGENT_RUNTIME=sdk.
agents = ["agent-framework-core==1.23.0", "agent-framework-openai==1.17.0"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11", "agent-framework-core==1.23.0", "agent-framework-openai==1.17.0"]

[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
packages = ["app"]
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# the openai SDK types reasoning_effort as a Literal; the value comes from the environment (str)
module = "app.agents.llm"
disable_error_code = ["arg-type"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
